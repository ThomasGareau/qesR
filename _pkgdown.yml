url: https://thomasgareau.github.io/qesR/

# The site is built locally or by .github/workflows/pkgdown.yml, and checked
# by data-raw/check_site.R. It is published to gh-pages only by hand (the
# workflow's manual run), never on push.

# Articles renamed since the published site: a redirect page keeps their old
# addresses working.
redirects:
  - ["articles/study-citations.html", "articles/citations.html"]
  - ["articles/fr-citations-etudes.html", "articles/fr-citations.html"]
  # the example pages of qesR 0.7 (replaced in 0.8.0)
  - ["articles/analysis-vote-choice.html", "articles/realignment.html"]
  - ["articles/analysis-sovereignty.html", "articles/sovereignty-generations.html"]
  - ["articles/analysis-descriptive.html", "articles/recipes.html"]
  - ["articles/fr-analyse-choix-vote.html", "articles/fr-realignement.html"]
  - ["articles/fr-analyse-souverainete.html", "articles/fr-souverainete-generations.html"]
  - ["articles/fr-analyse-descriptive.html", "articles/fr-recettes.html"]

# Figures of ordinary chunks (the recipes page); the figures of the other
# example pages are drawn by vignettes/articles/_theme.R, in a light and a
# dark version.
figures:
  dev: ragg::agg_png
  dpi: 96
  fig.retina: 2
  fig.width: 7
  fig.height: 4.2

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # Colours from the logo (man/figures/logo.svg): navy #0B3D91, gold
    # #F2B632. WCAG contrast ratios (AA asks for 4.5:1 for text):
    # - light theme: primary and links navy #0B3D91, 10.0:1 on white
    #   (8.3:1 on the light navbar, ~#E6E9EE); hover #093174, 12.3:1.
    # - dark theme: navy is 1.5:1 on the #212529 background, and the tint
    #   Bootstrap would derive for links (40% white, #6D8BBD) only 4.46:1,
    #   so links and primary text use #93B4EC, a lighter blue of the navy's
    #   hue: 7.3:1 on #212529, 6.3:1 on #2b3035, 6.4:1 on the dark navbar
    #   (~#292F36); hover #A9C3F0, 8.6:1.
    # - gold is decoration only (1.8:1 on white): the navbar rule and, in
    #   the dark theme, the focus ring (8.5:1 on #212529, 7.4:1 on the
    #   dark navbar; pkgdown/extra.css).
    primary: "#0B3D91"
    secondary: "#3e4b63"
    link-color: "#0B3D91"
    link-color-dark: "#93B4EC"
    primary-text-emphasis-dark: "#93B4EC"
    font-size-base: 1.0625rem
    line-height-base: 1.6
    headings-font-weight: 650
    border-radius: 0.375rem
  # The image of shared links (og:image). pkgdown would use logo.svg, which
  # Facebook, X, LinkedIn and Slack do not show; logo.png is the same logo.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "qesR logo"
  # The FR/EN button of the navbar (styled by .qesr-lang-switch in
  # pkgdown/extra.css). It goes to the page's translation: the page's own
  # "Version française" / "English version" link, which every article has
  # and data-raw/check_vignette_pairs.R checks, so it cannot drift from the
  # pairs. Pages without such a link use the fallback map below; any other
  # page goes to the other language's home. data-raw/check_site.R reads
  # this map and checks that every built page gets a target that exists.
  # No dollar sign in the script: pkgdown passes it through the pandoc
  # template of each article, where "$" starts a variable.
  includes:
    before_body: |
      <script>
      (function () {
        var fallback = {
          "index.html": "articles/fr-accueil.html",
          "reference/index.html": "reference/qesR-fr.html",
          "reference/qesR-package.html": "reference/qesR-fr.html",
          "reference/qesR-fr.html": "reference/qesR-package.html"
        };
        var french = ["reference/qesR-fr.html"];
        document.addEventListener("DOMContentLoaded", function () {
          var container = document.querySelector(".navbar .container") ||
            document.querySelector(".navbar .container-fluid");
          var brand = document.querySelector(".navbar .navbar-brand");
          if (!container || !brand) return;
          // the site root, from the brand link (pkgdown writes it relative)
          var root = new URL(brand.getAttribute("href") || "index.html", window.location.href);
          root = root.href.slice(0, root.href.lastIndexOf("/") + 1);
          var here = window.location.href.split("#")[0].split("?")[0];
          var rel = here.indexOf(root) === 0 ? decodeURIComponent(here.slice(root.length)) : "";
          if (rel === "" || rel.charAt(rel.length - 1) === "/") rel += "index.html";
          var isFrench = /^articles\/fr-/.test(rel) || french.indexOf(rel) >= 0;
          // the page's own link to its translation
          var target = null;
          var links = document.querySelectorAll("main a[href]");
          for (var i = 0; i < links.length; i++) {
            var text = links[i].textContent.replace(/\s+/g, " ").trim();
            if (text === (isFrench ? "English version" : "Version fran\u00e7aise")) {
              target = new URL(links[i].getAttribute("href"), window.location.href).href;
              break;
            }
          }
          if (!target) {
            target = root + (fallback[rel] || (isFrench ? "index.html" : "articles/fr-accueil.html"));
          }
          var wrap = document.createElement("div");
          wrap.className = "qesr-lang-switch-wrap";
          var link = document.createElement("a");
          link.className = "qesr-lang-switch";
          link.href = target;
          link.textContent = isFrench ? "EN" : "FR";
          link.lang = isFrench ? "en" : "fr";
          link.hreflang = isFrench ? "en" : "fr";
          link.setAttribute("aria-label", isFrench ? "Switch to English" : "Basculer en fran\u00e7ais");
          link.title = isFrench ? "English" : "Fran\u00e7ais";
          wrap.appendChild(link);
          // before the menu button, so that it stays visible on a phone;
          // extra.css moves it after the menus on a wide screen
          var toggler = container.querySelector(".navbar-toggler");
          if (toggler) container.insertBefore(wrap, toggler); else container.appendChild(wrap);
        });
      })();
      </script>

home:
  title: qesR
  description: >
    Load the Quebec Election Studies and related Quebec election surveys in
    R, and harmonize 11 of them into one data frame, with codebooks, search
    and citations in English and French.
  sidebar:
    structure: [links, license, citation, authors, dev]
  links:
  - text: Français
    href: articles/fr-accueil.html
  - text: Quebec Election Studies (CECD)
    href: https://csdc-cecd.ca/portail-quebecois-sur-lopinion-publique/

authors:
  Thomas Gareau-Paquette:
    href: https://thomasgp.com

navbar:
  # One English navbar; the FR/EN button (template.includes above) goes to
  # each page's translation. data-raw/check_site.R checks that every entry
  # is a page with a French partner.
  structure:
    left: [intro, examples, studies, harmonization, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    examples:
      text: Examples
      menu:
      - text: "From two parties to four: realignment"
        href: articles/realignment.html
      - text: "A generation gap that reversed: sovereignty"
        href: articles/sovereignty-generations.html
      - text: "Two dimensions: sovereignty and left-right"
        href: articles/dimensions.html
      - text: Who votes? Turnout
        href: articles/turnout.html
      - text: Changing minds during the campaign
        href: articles/transitions.html
      - text: How far off are surveys?
        href: articles/survey-vs-official.html
      - text: "-------"
      - text: "Recipes: pooled variables in five minutes"
        href: articles/recipes.html
    studies:
      text: Studies
      menu:
      - text: Study catalog
        href: articles/studies.html
      - text: Citing qesR and the studies
        href: articles/citations.html
    harmonization:
      text: Harmonization
      menu:
      - text: How it works
        href: articles/harmonization.html
      - text: "One file for every study: qes_decon()"
        href: articles/decon.html
      - text: Coverage by study
        href: articles/coverage.html
      - text: Variable reference
        href: articles/harmonization-reference.html
      - text: Validation against official results
        href: articles/validation.html
      - text: The merged file (get_qes_master)
        href: articles/merged-dataset.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/ThomasGareau/qesR
      aria-label: GitHub repository

reference:
# One section per @family of the help pages (check_site.R checks it), in the
# order of design.md section 9.1, after the package overview.
- title: Package overview
  desc: >
    What qesR does, its options and its conditions, in English and in French
    (`?qesR-fr`), with a table of every function.
  contents:
  - qesR-package
  - qesR-fr
- title: Data
  desc: >
    Load a study from its original data file, or stack 11 studies in the
    merged file. Data are returned, never written into your workspace unless you
    ask.
  contents:
  - get_qes
  - get_qes_master
- title: Studies and documents
  desc: >
    The offline catalog of the studies qesR can load, their codebooks,
    questionnaires and reports, and the original files themselves. No
    network request unless you ask for one.
  contents:
  - qes_studies
  - qes_docs
  - qes_download
- title: Codebooks and search
  desc: >
    What each variable measures, the exact question asked, in English and
    French, and which codes mean "don't know" or "refused". Offline for every
    study.
  contents:
  - qes_codebook
  - qes_question
  - qes_search
  - qes_missing
- title: Harmonization
  desc: >
    One data frame across the 11 studies: `qes_spec()` shows which studies
    have which harmonized variable and how comparable each study's question
    is; `qes_harmonize()` applies the rules, with a reason for every missing
    value and each respondent's waves and weights; `qes_decon()` gives one
    flat data frame of relaxed harmonized variables, one concept per column
    even where the questions differ; `qes_design()` turns the result into a
    survey design. See
    [How harmonization works](../articles/harmonization.html).
  contents:
  - qes_spec
  - qes_harmonize
  - qes_decon
  - qes_design
  - qes_party_lineage
- title: Reproducibility
  desc: >
    Which file a result was read from, and how to cite qesR and each dataset.
  contents:
  - qes_provenance
  - qes_cite
- title: Cache
  desc: >
    Where downloaded files are kept, and how to list or delete them.
  contents:
  - qes_cache_info
  - qes_cache_clear
- title: Older function names
  desc: |
    Earlier names of qesR functions. They keep working, with the same
    arguments, and will not be removed; each prints a one-time notice
    naming its replacement. [The upgrading guide](../articles/migrating-0.7.html)
    says what changed in their results.

    | Older name | Replacement |
    |---|---|
    | `get_codebook()`, `get_qes_codebook()` | `qes_codebook()` |
    | `format_codebook()` | `qes_codebook(codebook, layout = )` |
    | `get_value_labels()` | `qes_codebook(layout = "long")` |
    | `get_question()` | `qes_question()` |
    | `get_codebook_files()`, `get_qes_codebook_files()` | `qes_docs()` |
    | `download_codebook()` | `qes_download(what = "docs")` |
    | `get_preview()` | `head(get_qes())` |
    | `get_qescodes()` | `qes_studies()` |
    | `get_decon()` | `qes_harmonize(srvy, targets = "decon")`, or `qes_decon()` for every study, relaxed |
  contents:
  - qesR-deprecated
  - get_qescodes
  - get_preview
  - get_codebook
  - format_codebook
  - get_value_labels
  - get_question
  - get_codebook_files
  - download_codebook
  - get_decon

