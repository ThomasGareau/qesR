reference:
# One section per @family of the help pages (check_site.R checks it), in the
# order of design.md section 9.1, after the package overview.
- title: Package overview
  desc: >
    What qesR does, its options and its conditions, in English and in French
    (`?qesR-fr`), with a table of every function.
  contents:
  - qesR-package
  - qesR-fr
- title: Data
  desc: >
    Load a study from its pinned original file, or build the legacy merged
    file of qesR 0.4.4. Data are returned, never written into your workspace
    unless you ask.
  contents:
  - get_qes
  - get_qes_master
- title: Studies and documents
  desc: >
    The offline catalog of the studies qesR can load, their codebooks,
    questionnaires and reports, and the original files themselves. No
    network request unless you ask for one.
  contents:
  - qes_studies
  - qes_docs
  - qes_download
- title: Codebooks and search
  desc: >
    What each variable measures, the exact question asked, in English and
    French, and which codes mean "don't know" or "refused". Offline for every
    study (the metadata of the 2022 study keeps its licence, CC BY-NC 4.0).
  contents:
  - qes_codebook
  - qes_question
  - qes_search
  - qes_missing
- title: Harmonization (experimental)
  desc: >
    One data frame across the 11 studies, from a specification checked
    against the original files (rows signed off by a reviewer are applied
    by default, the rows still in review only with `include_draft = TRUE`):
    `qes_spec()` shows which
    studies have which harmonized variable and how comparable each study's
    question is; `qes_harmonize()` applies it, with a reason for every
    missing value and each respondent's waves and weights; `qes_design()`
    turns the result into a survey design. Articles, in English and French:
    [Harmonizing across studies](../articles/harmonization.html), from
    `qes_harmonize()` to a weighted estimate;
    [Coverage by study](../articles/coverage.html), the grade of every
    target in every study;
    [Validation against official results](../articles/validation.html),
    the harmonized studies against the official results and the census;
    and the
    [Harmonization reference](../articles/harmonization-reference.html).
  contents:
  - qes_spec
  - qes_harmonize
  - qes_design
  - qes_party_lineage
- title: Reproducibility
  desc: >
    Which file a result was read from, and how to cite qesR and each dataset.
  contents:
  - qes_provenance
  - qes_cite
- title: Cache
  desc: >
    Where downloaded files are kept, and how to list or delete them.
  contents:
  - qes_cache_info
  - qes_cache_clear
- title: Legacy and deprecated
  desc: |
    Functions from qesR 0.4.4. They keep working, with the same arguments,
    and will not be removed; each prints a one-time notice naming its
    replacement. [Moving from qesR 0.4.4 to 0.7.0](../articles/migrating-0.7.html)
    says what changed in their results.

    | 0.4.4 | Replacement |
    |---|---|
    | `get_codebook()`, `get_qes_codebook()` | `qes_codebook()` |
    | `format_codebook()` | `qes_codebook(codebook, layout = )` |
    | `get_value_labels()` | `qes_codebook(layout = "long")` |
    | `get_question()` | `qes_question()` |
    | `get_codebook_files()`, `get_qes_codebook_files()` | `qes_docs()` |
    | `download_codebook()` | `qes_download(what = "docs")` |
    | `get_preview()` | `head(get_qes())` |
    | `get_qescodes()` | `qes_studies()` |
    | `get_decon()` | `qes_harmonize(srvy, targets = "decon")` |
  contents:
  - qesR-deprecated
  - get_qescodes
  - get_preview
  - get_codebook
  - format_codebook
  - get_value_labels
  - get_question
  - get_codebook_files
  - download_codebook
  - get_decon

articles:
- title: Guides
  navbar: ~
  contents:
  - get-started
  - articles/studies
  - citations
  - migrating-0.7
  - articles/merged-dataset
- title: Harmonization (experimental)
  desc: >
    Built from the specification that ships with qesR. The first article
    and the validation read the full data files through qesR's cache when
    the site is built; the coverage grid and the reference are generated
    from the specification alone.
  navbar: ~
  contents:
  - articles/harmonization
  - articles/coverage
  - harmonization-reference
  - articles/validation
- title: Examples
  desc: >
    Built on the pooled harmonized variables (`vote_choice`,
    `sov_support`, `pol_interest`, `turnout`) when the site is built, from
    the full data files downloaded through qesR's cache, with weighted
    estimates and 95% confidence intervals; each estimate is within one
    study and wave, with that study's reviewed weight.
  navbar: ~
  contents:
  - articles/realignment
  - articles/sovereignty-generations
  - articles/dimensions
  - articles/turnout
  - articles/transitions
  - articles/survey-vs-official
  - articles/recipes
- title: Guides en français
  navbar: ~
  contents:
  - fr-demarrage
  - articles/fr-etudes
  - fr-citations
  - fr-migrer-0.7
  - articles/fr-donnees-fusionnees
- title: Harmonisation en français (expérimental)
  desc: >
    Construits à partir de la spécification fournie avec qesR. Le premier
    article et la validation lisent les fichiers de données complets par le
    cache de qesR à la construction du site ; la grille de couverture et la
    référence sont générées à partir de la spécification seule.
  navbar: ~
  contents:
  - articles/fr-harmonisation
  - articles/fr-couverture
  - fr-reference-harmonisation
  - articles/fr-validation
- title: Exemples en français
  desc: >
    Construits sur les variables harmonisées regroupées (`vote_choice`,
    `sov_support`, `pol_interest`, `turnout`) à la construction du site, à
    partir des fichiers de données complets téléchargés par le cache de
    qesR, avec des estimations pondérées et des intervalles de confiance à
    95 % ; chaque estimation est faite dans une seule étude et une seule
    vague, avec la pondération révisée de cette étude.
  navbar: ~
  contents:
  - articles/fr-realignement
  - articles/fr-souverainete-generations
  - articles/fr-dimensions
  - articles/fr-participation
  - articles/fr-transitions
  - articles/fr-enquetes-resultats
  - articles/fr-recettes
