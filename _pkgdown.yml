url: https://thomasgareau.github.io/qesR/

# The site is built locally or by .github/workflows/pkgdown.yml, and checked
# by data-raw/check_site.R. It is published to gh-pages only by hand (the
# workflow's manual run), never on push.

# Articles renamed since the published site: a redirect page keeps their old
# addresses working.
redirects:
  - ["articles/study-citations.html", "articles/citations.html"]
  - ["articles/fr-citations-etudes.html", "articles/fr-citations.html"]
  # the example pages of qesR 0.7 (replaced in 0.8.0)
  - ["articles/analysis-vote-choice.html", "articles/realignment.html"]
  - ["articles/analysis-sovereignty.html", "articles/sovereignty-generations.html"]
  - ["articles/analysis-descriptive.html", "articles/recipes.html"]
  - ["articles/fr-analyse-choix-vote.html", "articles/fr-realignement.html"]
  - ["articles/fr-analyse-souverainete.html", "articles/fr-souverainete-generations.html"]
  - ["articles/fr-analyse-descriptive.html", "articles/fr-recettes.html"]

# Figures of ordinary chunks (the recipes page); the figures of the other
# example pages are drawn by vignettes/articles/_theme.R, in a light and a
# dark version.
figures:
  dev: ragg::agg_png
  dpi: 96
  fig.retina: 2
  fig.width: 7
  fig.height: 4.2

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # Colours from the logo (man/figures/logo.svg): navy #0B3D91, gold
    # #F2B632. WCAG contrast ratios (AA asks for 4.5:1 for text):
    # - light theme: primary and links navy #0B3D91, 10.0:1 on white
    #   (8.3:1 on the light navbar, ~#E6E9EE); hover #093174, 12.3:1.
    # - dark theme: navy is 1.5:1 on the #212529 background, and the tint
    #   Bootstrap would derive for links (40% white, #6D8BBD) only 4.46:1,
    #   so links and primary text use #93B4EC, a lighter blue of the navy's
    #   hue: 7.3:1 on #212529, 6.3:1 on #2b3035, 6.4:1 on the dark navbar
    #   (~#292F36); hover #A9C3F0, 8.6:1.
    # - gold is decoration only (1.8:1 on white): the navbar rule and, in
    #   the dark theme, the focus ring (8.5:1 on #212529, 7.4:1 on the
    #   dark navbar; pkgdown/extra.css).
    primary: "#0B3D91"
    secondary: "#3e4b63"
    link-color: "#0B3D91"
    link-color-dark: "#93B4EC"
    primary-text-emphasis-dark: "#93B4EC"
    font-size-base: 1.0625rem
    line-height-base: 1.6
    headings-font-weight: 650
    border-radius: 0.375rem
  # The image of shared links (og:image). pkgdown would use logo.svg, which
  # Facebook, X, LinkedIn and Slack do not show; logo.png is the same logo.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "qesR logo"
  # The one script of the site (styled in pkgdown/extra.css):
  # - the FR/EN button of the navbar (.qesr-lang-switch). It goes to the
  #   page's translation: the page's own "Version française" / "English
  #   version" link, which every article has and
  #   data-raw/check_vignette_pairs.R checks, so it cannot drift from the
  #   pairs. Pages without such a link use the fallback map below; any
  #   other page goes to the other language's home. data-raw/check_site.R
  #   reads this map and checks that every built page gets a target that
  #   exists.
  # - on a French page (articles/fr-*, reference/qesR-fr.html): the
  #   document's lang is "fr", and the navbar is translated: each English
  #   entry of the navbar (below) gets its French text and, where it has
  #   one, its French partner's address (map navFr, keyed by the English
  #   address; menus without an address by their English text). An entry
  #   missing from the map stays in English.
  # - wide tables: each table of the page is wrapped in a div.qesr-scroll
  #   that scrolls sideways; when the table is wider than the page, the div
  #   is a labelled region that takes the keyboard focus, so that it can be
  #   scrolled with the arrow keys.
  # No dollar sign in the script: pkgdown passes it through the pandoc
  # template of each article, where "$" starts a variable.
  includes:
    before_body: |
      <script>
      (function () {
        var fallback = {
          "index.html": "articles/fr-accueil.html",
          "reference/index.html": "reference/qesR-fr.html",
          "reference/qesR-package.html": "reference/qesR-fr.html",
          "reference/qesR-fr.html": "reference/qesR-package.html"
        };
        var french = ["reference/qesR-fr.html"];
        var navFr = {
          "articles/get-started.html": ["Démarrer", "articles/fr-demarrage.html"],
          "Examples": ["Exemples"],
          "articles/realignment.html": ["De deux partis à quatre", "articles/fr-realignement.html"],
          "articles/sovereignty-generations.html": ["Les jeunes sont-ils encore les plus souverainistes ?", "articles/fr-souverainete-generations.html"],
          "articles/dimensions.html": ["Deux dimensions de la concurrence", "articles/fr-dimensions.html"],
          "articles/turnout.html": ["Qui vote ?", "articles/fr-participation.html"],
          "articles/transitions.html": ["Les élections québécoises se jouent-elles pendant la campagne ?", "articles/fr-transitions.html"],
          "articles/survey-vs-official.html": ["Les enquêtes sous-estiment-elles les libéraux ?", "articles/fr-enquetes-resultats.html"],
          "articles/recipes.html": ["Recettes : le clivage linguistique du vote libéral", "articles/fr-recettes.html"],
          "Studies": ["Études"],
          "articles/studies.html": ["Catalogue des études", "articles/fr-etudes.html"],
          "articles/citations.html": ["Citer qesR et les études", "articles/fr-citations.html"],
          "Harmonization": ["Harmonisation"],
          "articles/harmonization.html": ["Comment fonctionne l’harmonisation", "articles/fr-harmonisation.html"],
          "articles/decon.html": ["Un seul fichier pour toutes les études : qes_decon()", "articles/fr-decon.html"],
          "articles/coverage.html": ["Couverture par étude", "articles/fr-couverture.html"],
          "articles/harmonization-reference.html": ["Référence des variables", "articles/fr-reference-harmonisation.html"],
          "articles/validation.html": ["Validation par les résultats officiels", "articles/fr-validation.html"],
          "articles/merged-dataset.html": ["Le fichier fusionné (get_qes_master)", "articles/fr-donnees-fusionnees.html"],
          "reference/index.html": ["Référence", "reference/qesR-fr.html"],
          "news/index.html": ["Nouveautés"]
        };
        var path = window.location.pathname;
        var isFrenchPath = /\/articles\/fr-[^\/]*\.html/.test(path) || /\/reference\/qesR-fr\.html/.test(path);
        // set at once, before the page is drawn, for screen readers and hyphenation
        if (isFrenchPath) document.documentElement.lang = "fr";
        document.addEventListener("DOMContentLoaded", function () {
          var container = document.querySelector(".navbar .container") ||
            document.querySelector(".navbar .container-fluid");
          var brand = document.querySelector(".navbar .navbar-brand");
          wrapTables(isFrenchPath);
          if (!container || !brand) return;
          // the site root, from the brand link (pkgdown writes it relative)
          var root = new URL(brand.getAttribute("href") || "index.html", window.location.href);
          root = root.href.slice(0, root.href.lastIndexOf("/") + 1);
          var here = window.location.href.split("#")[0].split("?")[0];
          var rel = here.indexOf(root) === 0 ? decodeURIComponent(here.slice(root.length)) : "";
          if (rel === "" || rel.charAt(rel.length - 1) === "/") rel += "index.html";
          var isFrench = /^articles\/fr-/.test(rel) || french.indexOf(rel) >= 0;
          if (isFrench) {
            document.documentElement.lang = "fr";
            translateNavbar(root);
          }
          // the page's own link to its translation
          var target = null;
          var links = document.querySelectorAll("main a[href]");
          for (var i = 0; i < links.length; i++) {
            var text = links[i].textContent.replace(/\s+/g, " ").trim();
            if (text === (isFrench ? "English version" : "Version française")) {
              target = new URL(links[i].getAttribute("href"), window.location.href).href;
              break;
            }
          }
          if (!target) {
            target = root + (fallback[rel] || (isFrench ? "index.html" : "articles/fr-accueil.html"));
          }
          var wrap = document.createElement("div");
          wrap.className = "qesr-lang-switch-wrap";
          var link = document.createElement("a");
          link.className = "qesr-lang-switch";
          link.href = target;
          link.textContent = isFrench ? "EN" : "FR";
          link.lang = isFrench ? "en" : "fr";
          link.hreflang = isFrench ? "en" : "fr";
          link.setAttribute("aria-label", isFrench ? "Switch to English" : "Basculer en français");
          link.title = isFrench ? "English" : "Français";
          wrap.appendChild(link);
          // before the menu button, so that it stays visible on a phone;
          // extra.css moves it after the menus on a wide screen
          var toggler = container.querySelector(".navbar-toggler");
          if (toggler) container.insertBefore(wrap, toggler); else container.appendChild(wrap);
        });

        // French text and addresses for the navbar entries of navFr
        function translateNavbar(root) {
          var items = document.querySelectorAll(".navbar .nav-link, .navbar .dropdown-item");
          for (var i = 0; i < items.length; i++) {
            var a = items[i];
            var href = a.getAttribute("href");
            var key = null;
            if (href && href.charAt(0) !== "#") {
              var abs = new URL(href, window.location.href).href.split("#")[0];
              if (abs.indexOf(root) === 0) key = abs.slice(root.length);
            }
            if (!key || !navFr[key]) key = a.textContent.replace(/\s+/g, " ").trim();
            var fr = navFr[key];
            if (!fr) continue;
            // keep icons and the menu caret: replace the text node only
            var done = false;
            for (var j = 0; j < a.childNodes.length; j++) {
              var node = a.childNodes[j];
              if (node.nodeType === 3 && node.nodeValue.trim() !== "") {
                node.nodeValue = node.nodeValue.replace(node.nodeValue.trim(), fr[0]);
                done = true;
                break;
              }
            }
            if (!done) continue;
            if (fr[1]) {
              a.setAttribute("href", root + fr[1]);
              a.hreflang = "fr";
            }
          }
        }

        // every table of the page in a scrolling region
        function wrapTables(fr) {
          var tables = document.querySelectorAll("main table");
          var regions = [];
          for (var i = 0; i < tables.length; i++) {
            var t = tables[i];
            var parent = t.parentNode;
            if (!parent || (parent.classList && (parent.classList.contains("qesr-scroll") ||
                parent.classList.contains("table-responsive")))) continue;
            var box = document.createElement("div");
            box.className = "qesr-scroll";
            parent.insertBefore(box, t);
            box.appendChild(t);
            box.setAttribute("aria-label", tableName(t, fr));
            regions.push(box);
          }
          function update() {
            for (var k = 0; k < regions.length; k++) {
              var r = regions[k];
              if (r.scrollWidth > r.clientWidth + 1) {
                r.setAttribute("role", "region");
                r.setAttribute("tabindex", "0");
              } else {
                r.removeAttribute("role");
                r.removeAttribute("tabindex");
              }
            }
          }
          update();
          var timer = null;
          window.addEventListener("resize", function () {
            clearTimeout(timer);
            timer = setTimeout(update, 150);
          });
          // tables in a closed <details> have no width until it opens
          document.addEventListener("toggle", update, true);
        }

        // a table's name: its caption, else the heading or figure title above it
        function tableName(t, fr) {
          var cap = t.querySelector("caption");
          if (cap && cap.textContent.trim()) return cap.textContent.replace(/\s+/g, " ").trim();
          var fig = t.closest ? t.closest("figure") : null;
          var title = fig ? fig.querySelector(".qesr-title") : null;
          if (title) return (fr ? "Tableau : " : "Table: ") + title.textContent.trim();
          var node = t;
          while (node && node !== document.body) {
            var prev = node.previousElementSibling;
            while (prev) {
              if (/^H[1-6]/.test(prev.tagName)) {
                return (fr ? "Tableau : " : "Table: ") + prev.textContent.replace(/\s+/g, " ").trim();
              }
              var h = prev.querySelectorAll ? prev.querySelectorAll("h1, h2, h3, h4, h5, h6") : [];
              if (h.length) {
                return (fr ? "Tableau : " : "Table: ") + h[h.length - 1].textContent.replace(/\s+/g, " ").trim();
              }
              prev = prev.previousElementSibling;
            }
            node = node.parentNode;
          }
          return fr ? "Tableau" : "Table";
        }
      })();
      </script>

home:
  title: "qesR: Quebec Election Studies in R"
  description: >
    Load the Quebec Election Studies and related Quebec election surveys in
    R, and harmonize 11 of them into one data frame, with codebooks, search
    and citations in English and French.
  # The licence box of the sidebar, spelled as on the rest of the site
  # (pkgdown's own box is headed "License").
  sidebar:
    structure: [links, licence, citation, authors, dev]
    components:
      licence:
        title: Licence
        text: >
          [MIT](LICENSE.html) for the code. The data are not part of the
          package; each study keeps its own licence
          ([details](articles/citations.html#licences-and-attribution)).
  links:
  - text: Français
    href: articles/fr-accueil.html
  - text: Quebec Election Studies (CECD)
    href: https://csdc-cecd.ca/portail-quebecois-sur-lopinion-publique/

authors:
  Thomas Gareau-Paquette:
    href: https://thomasgp.com

navbar:
  # One English navbar; the FR/EN button (template.includes above) goes to
  # each page's translation. data-raw/check_site.R checks that every entry
  # is a page with a French partner.
  structure:
    left: [intro, examples, studies, harmonization, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    examples:
      text: Examples
      menu:
      - text: From two parties to four
        href: articles/realignment.html
      - text: Are young Quebecers still the most pro-independence?
        href: articles/sovereignty-generations.html
      - text: Two dimensions of competition
        href: articles/dimensions.html
      - text: Who votes?
        href: articles/turnout.html
      - text: Are Quebec elections decided during the campaign?
        href: articles/transitions.html
      - text: Do surveys miss the Liberals?
        href: articles/survey-vs-official.html
      - text: "-------"
      - text: "Recipes: the language divide in the Liberal vote"
        href: articles/recipes.html
    studies:
      text: Studies
      menu:
      - text: Study catalog
        href: articles/studies.html
      - text: Citing qesR and the studies
        href: articles/citations.html
    harmonization:
      text: Harmonization
      menu:
      - text: How harmonization works
        href: articles/harmonization.html
      - text: "One file for every study: qes_decon()"
        href: articles/decon.html
      - text: Coverage by study
        href: articles/coverage.html
      - text: Variable reference
        href: articles/harmonization-reference.html
      - text: Validation against official results
        href: articles/validation.html
      - text: The merged file (get_qes_master)
        href: articles/merged-dataset.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/ThomasGareau/qesR
      aria-label: GitHub repository

reference:
# One section per @family of the help pages (check_site.R checks it), in the
# order of design.md section 9.1, after the package overview.
- title: Package overview
  desc: >
    What qesR does, its options and its conditions, in English and in French
    (`?qesR-fr`), with a table of every function.
  contents:
  - qesR-package
  - qesR-fr
- title: Data
  desc: >
    Load a study from its original data file, or stack 11 studies in the
    merged file. Data are returned, never written into your workspace unless you
    ask.
  contents:
  - get_qes
  - get_qes_master
- title: Studies and documents
  desc: >
    The offline catalog of the studies qesR can load, their codebooks,
    questionnaires and reports, and the original files themselves. No
    network request unless you ask for one.
  contents:
  - qes_studies
  - qes_docs
  - qes_download
- title: Codebooks and search
  desc: >
    What each variable measures, the exact question asked, in English and
    French, and which codes mean "don't know" or "refused". Offline for every
    study.
  contents:
  - qes_codebook
  - qes_question
  - qes_search
  - qes_missing
- title: Harmonization
  desc: >
    One data frame across the 11 studies: `qes_spec()` shows which studies
    have which harmonized variable and how comparable each study's question
    is; `qes_harmonize()` applies the rules, with a reason for every missing
    value and each respondent's waves and weights; `qes_decon()` gives one
    flat data frame of relaxed harmonized variables, one concept per column
    even where the questions differ; `qes_design()` turns the result into a
    survey design. See
    [How harmonization works](../articles/harmonization.html).
  contents:
  - qes_spec
  - qes_harmonize
  - qes_decon
  - qes_design
  - qes_party_lineage
- title: Reproducibility
  desc: >
    Which file a result was read from, and how to cite qesR and each dataset.
  contents:
  - qes_provenance
  - qes_cite
- title: Cache
  desc: >
    Where downloaded files are kept, and how to list or delete them.
  contents:
  - qes_cache_info
  - qes_cache_clear
- title: Older function names
  desc: >
    Earlier names that keep working; [`?qesR-deprecated`](qesR-deprecated.html)
    names each one's replacement.
  contents:
  - qesR-deprecated
  - get_qescodes
  - get_preview
  - get_codebook
  - format_codebook
  - get_value_labels
  - get_question
  - get_codebook_files
  - download_codebook
  - get_decon

