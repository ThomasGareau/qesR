url: https://thomasgareau.github.io/qesR/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0468b9"
    secondary: "#3e4b63"
    link-color: "#0357a0"
    font-size-base: 1.0625rem
    line-height-base: 1.6
    headings-font-weight: 650
    border-radius: 0.375rem

home:
  title: qesR
  description: >
    Load Quebec Election Study data and related Quebec election surveys in R,
    with study metadata, documents and citations.
  sidebar:
    structure: [links, license, citation, authors, dev]

authors:
  Thomas Gareau-Paquette:
    href: https://thomasgp.com

navbar:
  structure:
    left: [intro, studies, guides, guides_fr, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    studies:
      text: Studies
      href: articles/studies.html
    guides:
      text: Guides
      menu:
      - text: Getting started
        href: articles/get-started.html
      - text: Study catalog
        href: articles/studies.html
      - text: Study citations
        href: articles/study-citations.html
      - text: Merged dataset
        href: articles/merged-dataset.html
      - text: "-------"
      - text: Examples
      - text: Descriptive statistics
        href: articles/analysis-descriptive.html
      - text: Sovereignty attitudes
        href: articles/analysis-sovereignty.html
      - text: Vote choice over time
        href: articles/analysis-vote-choice.html
    guides_fr:
      text: Guides (FR)
      menu:
      - text: Démarrage
        href: articles/fr-demarrage.html
      - text: Catalogue des études
        href: articles/fr-etudes.html
      - text: Citations des études
        href: articles/fr-citations-etudes.html
      - text: Données fusionnées
        href: articles/fr-donnees-fusionnees.html
      - text: "-------"
      - text: Exemples
      - text: Statistiques descriptives
        href: articles/fr-analyse-descriptive.html
      - text: Attitudes souverainistes
        href: articles/fr-analyse-souverainete.html
      - text: Choix de vote
        href: articles/fr-analyse-choix-vote.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/ThomasGareau/qesR
      aria-label: GitHub repository

reference:
- title: Package
  contents:
  - qesR-package
- title: Studies, documents and citations
  desc: >
    The offline catalog: which studies qesR can load, their documents, how
    to cite them and which file a result was read from. No network request
    unless you ask for one.
  contents:
  - qes_studies
  - qes_docs
  - qes_cite
  - qes_provenance
- title: Data
  desc: >
    Load a study, save its original files, or build the harmonized master
    file.
  contents:
  - get_qes
  - qes_download
  - get_qes_master
- title: Codebooks and search
  desc: >
    What each variable measures, the exact question asked, in English and
    French, and which codes mean "don't know" or "refused". Offline for every
    study released under CC0.
  contents:
  - qes_codebook
  - qes_question
  - qes_search
  - qes_missing
- title: Cache
  desc: >
    Where downloaded files are kept, and how to list or delete them.
  contents:
  - qes_cache_info
  - qes_cache_clear
- title: Legacy functions
  desc: >
    Functions from qesR 0.4.4. They keep working, with the same arguments, and
    will not be removed. `?qesR-deprecated` names the replacement of each one.
  contents:
  - qesR-deprecated
  - get_qescodes
  - get_preview
  - get_codebook
  - format_codebook
  - get_value_labels
  - get_question
  - get_codebook_files
  - download_codebook
  - get_decon

articles:
- title: Guides
  navbar: ~
  contents:
  - get-started
  - articles/studies
  - study-citations
  - merged-dataset
- title: Examples
  navbar: ~
  contents:
  - analysis-descriptive
  - analysis-sovereignty
  - analysis-vote-choice
- title: Guides en français
  navbar: ~
  contents:
  - fr-demarrage
  - articles/fr-etudes
  - fr-citations-etudes
  - fr-donnees-fusionnees
- title: Exemples en français
  navbar: ~
  contents:
  - fr-analyse-descriptive
  - fr-analyse-souverainete
  - fr-analyse-choix-vote
