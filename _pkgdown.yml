reference:
- title: Discover
  desc: >
    Start here: the package overview (in English, and in French on
    `?qesR-fr`) and the offline catalog of the studies qesR can load, with
    their documents. No network request unless you ask for one.
  contents:
  - qesR-package
  - qesR-fr
  - qes_studies
  - qes_docs
- title: Get data
  desc: >
    Load a study from its pinned original file, save the original files
    themselves, or build the legacy merged file of qesR 0.4.4. Data are
    returned, never written into your workspace unless you ask.
  contents:
  - get_qes
  - qes_download
  - get_qes_master
- title: Metadata and search
  desc: >
    What each variable measures, the exact question asked, in English and
    French, and which codes mean "don't know" or "refused". Offline for every
    study released under CC0.
  contents:
  - qes_codebook
  - qes_question
  - qes_search
  - qes_missing
- title: Harmonization (experimental)
  desc: >
    A cross-study engine driven by a specification checked against the
    original files (rows not yet signed off by a reviewer are applied only
    with `include_draft = TRUE`): `qes_spec()`
    shows which studies have which harmonized variable and how comparable
    each study's question is; `qes_harmonize()` applies it, with a reason
    for every missing value, each respondent's waves and weights, and
    `qes_design()` turns the result into a survey design. Three articles
    go with them, in English and French, the last two generated from the
    spec: [Harmonizing across studies](../articles/harmonization.html),
    from `qes_harmonize()` to a weighted estimate;
    [Coverage by study](../articles/coverage.html), the grade of every
    target in every study; and the
    [Harmonization reference](../articles/harmonization-reference.html).
    `get_qes_master()` is kept for code written for qesR 0.4.4.
  contents:
  - qes_spec
  - qes_harmonize
  - qes_design
- title: Reproducibility
  desc: >
    Which file a result was read from, and how to cite qesR and each dataset.
  contents:
  - qes_provenance
  - qes_cite
- title: Cache
  desc: >
    Where downloaded files are kept, and how to list or delete them.
  contents:
  - qes_cache_info
  - qes_cache_clear
- title: Legacy and deprecated
  desc: >
    Functions from qesR 0.4.4. They keep working, with the same arguments,
    and will not be removed. `?qesR-deprecated` gives the replacement of
    each one.
  contents:
  - qesR-deprecated
  - get_qescodes
  - get_preview
  - get_codebook
  - format_codebook
  - get_value_labels
  - get_question
  - get_codebook_files
  - download_codebook
  - get_decon

articles:
- title: Guides
  navbar: ~
  contents:
  - get-started
  - articles/studies
  - citations
  - migrating-0.5
  - articles/merged-dataset
- title: Harmonization (experimental)
  desc: >
    Built from the specification that ships with qesR. The first article
    and the validation read the full data files through qesR's cache when
    the site is built; the coverage grid and the reference are generated
    from the specification alone.
  navbar: ~
  contents:
  - articles/harmonization
  - articles/coverage
  - harmonization-reference
  - articles/validation
- title: Examples
  desc: >
    Built when the site is built, from the full data files downloaded
    through qesR's cache. Each estimate is computed within one study, with
    that study's own weight.
  navbar: ~
  contents:
  - articles/analysis-descriptive
  - articles/analysis-sovereignty
  - articles/analysis-vote-choice
- title: Guides en français
  navbar: ~
  contents:
  - fr-demarrage
  - articles/fr-etudes
  - fr-citations
  - fr-migrer-0.5
  - articles/fr-donnees-fusionnees
- title: Harmonisation en français (expérimental)
  desc: >
    Construits à partir de la spécification fournie avec qesR. Le premier
    article et la validation lisent les fichiers de données complets par le
    cache de qesR à la construction du site ; la grille de couverture et la
    référence sont générées à partir de la spécification seule.
  navbar: ~
  contents:
  - articles/fr-harmonisation
  - articles/fr-couverture
  - fr-reference-harmonisation
  - articles/fr-validation
- title: Exemples en français
  desc: >
    Construits à la construction du site, à partir des fichiers de données
    complets téléchargés par le cache de qesR. Chaque estimation est
    calculée dans une seule étude, avec la pondération de cette étude.
  navbar: ~
  contents:
  - articles/fr-analyse-descriptive
  - articles/fr-analyse-souverainete
  - articles/fr-analyse-choix-vote
