url: https://thomasgareau.github.io/qesR/

# The site is built locally or by .github/workflows/pkgdown.yml, and checked
# by data-raw/check_site.R. It is published to gh-pages only by hand (the
# workflow's manual run), never on push.

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # Colours from the logo. Contrast on the light background: links 7.3:1,
    # primary 5.7:1; in dark mode Bootstrap derives #68a4d5 (5.9:1).
    primary: "#0468b9"
    secondary: "#3e4b63"
    link-color: "#0357a0"
    font-size-base: 1.0625rem
    line-height-base: 1.6
    headings-font-weight: 650
    border-radius: 0.375rem

home:
  title: qesR
  description: >
    Load the Quebec Election Studies and related Quebec election surveys in
    R, pinned to their original files, with offline codebooks, bilingual
    search and citations.
  sidebar:
    structure: [links, license, citation, authors, dev]
  links:
  - text: Aperçu en français (?qesR-fr)
    href: reference/qesR-fr.html
  - text: Quebec Election Studies (CECD)
    href: https://csdc-cecd.ca/portail-quebecois-sur-lopinion-publique/

authors:
  Thomas Gareau-Paquette:
    href: https://thomasgp.com

navbar:
  structure:
    left: [intro, studies, guides, guides_fr, reference, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    studies:
      text: Studies
      href: articles/studies.html
    # Each entry of "Guides" has its French partner at the same position in
    # "Guides (FR)"; data-raw/check_site.R checks it.
    guides:
      text: Guides
      menu:
      - text: Getting started
        href: articles/get-started.html
      - text: Study catalog
        href: articles/studies.html
      - text: Study citations
        href: articles/citations.html
      - text: Moving from qesR 0.4.4
        href: articles/migrating-0.5.html
      - text: Legacy merged file
        href: articles/merged-dataset.html
      - text: "-------"
      - text: Harmonization (experimental)
      - text: Harmonizing across studies
        href: articles/harmonization.html
      - text: Coverage by study
        href: articles/coverage.html
      - text: Harmonization reference
        href: articles/harmonization-reference.html
      - text: Validation against official results
        href: articles/validation.html
      - text: "-------"
      - text: Examples (built from the full data files)
      - text: Respondents by study
        href: articles/analysis-descriptive.html
      - text: Support for independence
        href: articles/analysis-sovereignty.html
      - text: Reported vote
        href: articles/analysis-vote-choice.html
      - text: "-------"
      - text: Function overview
        href: reference/qesR-package.html
    guides_fr:
      text: Guides (FR)
      menu:
      - text: Démarrage
        href: articles/fr-demarrage.html
      - text: Catalogue des études
        href: articles/fr-etudes.html
      - text: Citations des études
        href: articles/fr-citations.html
      - text: Passer de qesR 0.4.4 à 0.5.0
        href: articles/fr-migrer-0.5.html
      - text: Fichier fusionné hérité
        href: articles/fr-donnees-fusionnees.html
      - text: "-------"
      - text: Harmonisation (expérimental)
      - text: Harmoniser entre études
        href: articles/fr-harmonisation.html
      - text: Couverture par étude
        href: articles/fr-couverture.html
      - text: Référence de l'harmonisation
        href: articles/fr-reference-harmonisation.html
      - text: Validation par les résultats officiels
