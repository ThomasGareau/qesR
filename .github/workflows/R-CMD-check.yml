# R CMD check --as-cran on every push and pull request, all branches
# (design.md section 8.4). Replaces the former r-devel-check.yml, which ran one
# ubuntu r-devel job on main only.
#
# Tests run offline: network tests are skipped unless QESR_LIVE=true, which is
# never set here. The tier-1 live checks (tests/testthat/test-live-read.R) run
# locally, with QESR_TEST_DATA_DIR=<a download cache laid out by hand> (no
# request) or QESR_LIVE=true; the weekly live.yml job arrives with slice HZ7.

name: R-CMD-check

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_FORCE_SUGGESTS_: false
      QESR_LIVE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      # CI-only checks on sources that are not installed with the package
      # (design.md section 8.4). data-raw/spec_check.R arrives with the
      # harmonization spec (HZ1); until then this step is skipped.
      - name: Spec and source checks
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && hashFiles('data-raw/spec_check.R') != ''
        run: Rscript data-raw/spec_check.R
