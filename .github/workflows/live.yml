# Weekly live validation (design.md sections 5.10, 8.2 to 8.4; slice HZ7).
#
# Runs the tier-1 and tier-2 checks on the pinned original files:
#   V-L1  engine marginals and column hashes == inst/extdata/harmonize/expected/
#   V-L2  weighted reported vote vs the official results (Élections Québec),
#         within the recorded baseline + 2.0 points; turnout over-report;
#         margins vs the census (Statistics Canada)
#   V-L3  2018 weighting margins (methodological report, Table 14)
#   V-L4  construct-validity directions
#   V-L5  a new dataset version or md5 on Dataverse fails the job and lists it
# plus every other live test (get_qes() on each original, the legacy builders).
#
# The originals are restored from the Actions cache (keyed on the catalog's
# md5 pins); only missing files are downloaded, through qesR's own client
# (User-Agent "qesR/<ver> R/<ver>", no personal information, requests at
# least 1 s apart). A complete set is saved under the exact key right after
# the fetch, whatever the checks do; a fetch that fails partway saves what it
# got under a run-unique key, which the next run restores by prefix before
# fetching the rest and saving the complete set under the exact key.
# The job uploads an aggregates-only report, with the CC BY-NC notice of its
# qes2022 rows (inst/COPYRIGHTS, section 2); it never commits, pushes or opens
# issues. A failure is the notification.

name: live

"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v5

      # The cache of originals lives outside the checkout, at an absolute
      # path: actions/cache rejects a path with "." or ".." in it (0.7.0 had
      # the workspace's parent, "../qesr-cache", and its cache was never
      # saved). The runner context is not available in the job's env, so
      # the path is set here, for every later step (env.QESR_CACHE_DIR).
      - name: Cache directory
        run: |
          mkdir -p "${{ runner.temp }}/qesr-cache"
          echo "QESR_CACHE_DIR=${{ runner.temp }}/qesr-cache" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, any::withr

      # Restore and save are separate steps so that the fetched originals are
      # cached even when a later check fails (actions/cache saves only on
      # success): a failing week does not download them again. Cache keys
      # are immutable, so only a complete fetch is saved under the exact key;
      # a partial one goes under a run-unique key that restore-keys matches,
      # and the next complete fetch can still be saved under the exact key.
      - name: Restore the pinned originals
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QESR_CACHE_DIR }}
          key: qesr-originals-${{ hashFiles('inst/extdata/catalog/files.csv') }}
          restore-keys: |
            qesr-originals-${{ hashFiles('inst/extdata/catalog/files.csv') }}-partial-
            qesr-originals-

      - name: Fetch missing originals
        id: fetch
        run: Rscript data-raw/live_fetch.R

      - name: Save the pinned originals
        if: always() && steps.fetch.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QESR_CACHE_DIR }}
          key: qesr-originals-${{ hashFiles('inst/extdata/catalog/files.csv') }}

      - name: Save the originals fetched so far (partial fetch)
        if: always() && steps.fetch.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QESR_CACHE_DIR }}
          key: qesr-originals-${{ hashFiles('inst/extdata/catalog/files.csv') }}-partial-${{ github.run_id }}

      # The originals come from the cache (QESR_TEST_DATA_DIR: no request);
      # QESR_LIVE=true lets V-L5 ask Dataverse for the latest versions.
      - name: Live tests (V-L1 to V-L5)
        env:
          QESR_TEST_DATA_DIR: ${{ env.QESR_CACHE_DIR }}
          QESR_LIVE: "true"
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_local(".", reporter = "summary", stop_on_failure = FALSE)); cat(sprintf("failed %d, errors %d, skipped %d, passed %d\n", sum(res$failed), sum(res$error), sum(res$skipped), sum(res$passed))); if (sum(res$failed) > 0 || any(res$error)) quit(status = 1)'

      - name: Column hashes (V-L1)
        if: always()
        run: Rscript data-raw/build_hashes.R --check

      # The shipped dictionary and the joint gate counts (gates.csv) are
      # rebuilt from the cached originals (no request) and compared with the
      # committed files.
      - name: Dictionary (build_dictionary.R --check)
        if: always() && steps.fetch.outcome == 'success'
        run: Rscript data-raw/build_dictionary.R --check

      - name: Spec aggregates (build_sources.R --check)
        if: always() && steps.fetch.outcome == 'success'
        run: Rscript data-raw/build_sources.R --check

      # Information only: lists recorded baselines that differ from the report
      # (stale); the 2.0-point gate that fails the job is in the live tests.
      - name: Validation report (V-L2, census)
        if: always()
        continue-on-error: true
        run: Rscript data-raw/build_validation.R --check --out validation-report.csv

      # The report has the qes2022 rows (CC BY-NC 4.0, not MIT): their
      # licence and attribution notice is uploaded with it.
      - name: Upload the aggregates-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation-report.csv
            inst/COPYRIGHTS
          if-no-files-found: ignore
          retention-days: 90
